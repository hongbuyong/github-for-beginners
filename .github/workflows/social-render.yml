name: 인스타 이미지 만들기

on:
  push:
    branches: [main]
    paths: ["social/**", ".github/workflows/social-render.yml"]
  pull_request:
    paths: ["social/**", ".github/workflows/social-render.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: social/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: instagram
          path: social/out/
          retention-days: 30
